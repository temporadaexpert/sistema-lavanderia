name: CI

# Roda em push para a branch principal e em todos os PRs. Feature branches
# sem PR aberto não disparam — abrir PR (ou marcar como draft) ativa o CI.
# Evita execução duplicada de push + pull_request no mesmo commit.
on:
  push:
    branches: [main]
  pull_request:

# Cancela runs antigos quando um novo commit chega na mesma ref — economiza
# minutos sem prejudicar feedback.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
